<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14461a">
    <meta name="description" content="Miquilino V9 — jogo de Copas com IA nível Mestre, baralho animado e efeitos sonoros.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Miquilino V9</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- TELA INICIAL -->
    <section id="telaInicial" aria-label="Tela inicial do Miquilino">
        <img id="imagemMiquilino" src="miq.png" alt="Carta do Miquilino">
        <h1 id="tituloMiquilino">Miquilino</h1>
        <button type="button" id="btnIniciarMiquilino">Iniciar</button>
    </section>

    <!-- SELEÇÃO DE PERSONAGEM -->
    <div id="telaLogin" class="escondido">
        <div class="selecao-box">
            <h1>♥ Jogo de Copas ♠</h1>
            <p class="sub">Escolha seu personagem. Três máquinas serão sorteadas para jogar com você.</p>
            <button id="btnComecar" class="btn-modo" disabled><i class="fas fa-play"></i> Começar partida</button>
            <p id="personagemEscolhido" class="escolha-status">Escolha seu personagem</p>
            <div id="gradePersonagens" class="grade-personagens"></div>
            <p class="regra-selecao">Quem atingir 60 pontos ou mais sai após o fim da rodada. Uma máquina da reserva assume a vaga.</p>
        </div>
    </div>

    <!-- JOGO -->
    <div id="jogo" class="escondido">
        <div id="topbar">
            <div id="radio">
                <button id="btnRadio" aria-label="Tocar rádio"><i class="fas fa-play"></i></button>
                <button id="btnProx" aria-label="Próxima rádio"><i class="fas fa-forward"></i></button>
                <select id="selGenero" aria-label="Gênero da rádio"></select>
                <select id="selRadio" aria-label="Escolher rádio"><option value="" disabled selected>Carregando rádios…</option></select>
                <div id="controleVolume" aria-label="Controle de volume">
                    <button type="button" id="volMenos" aria-label="Diminuir volume">−</button>
                    <output id="volValor" for="volMenos volMais">60</output>
                    <button type="button" id="volMais" aria-label="Aumentar volume">+</button>
                </div>
                <button type="button" id="btnMuteDama" aria-label="Silenciar áudio da dama" aria-pressed="false">Cala boca Caio</button>
                <span id="radioNome">Rádio desligada</span>
            </div>
            <div id="status" role="status" aria-live="polite"></div>
            <button type="button" id="btnSom" title="Efeitos sonoros" aria-label="Ligar ou desligar efeitos sonoros" aria-pressed="false"><i class="fas fa-volume-high"></i></button>
            <button type="button" id="btnRanking" title="Ver Ranking Geral" aria-label="Ver Ranking Geral">
                <i class="fas fa-trophy"></i>
            </button>
        </div>

        <div id="mesa">
            <div id="j2" class="oponente"></div>
            <div id="j1" class="oponente"></div>
            <div id="j3" class="oponente"></div>
            <div id="areaCentral">
                <div id="carta-2" class="posicao-carta"></div>
                <div id="carta-1" class="posicao-carta"></div>
                <div id="carta-3" class="posicao-carta"></div>
                <div id="carta-0" class="posicao-carta"></div>
            </div>
            <div id="j0" class="oponente"></div>
        </div>

        <div id="maoJogador" aria-label="Sua mão"></div>

        <!-- Palco do baralho: embaralhar, cortar e dar as cartas -->
        <div id="palcoBaralho" class="escondido" aria-hidden="true">
            <div id="baralhoMesa"></div>
            <div id="legendaBaralho">
                <span id="legendaTexto"></span>
                <button type="button" id="btnPular">Pular ▸▸</button>
            </div>
        </div>

        <!-- Aparece SOMENTE quando a Q♠ é jogada -->
        <img id="efeitoQ" class="escondido" src="qspades.png" alt="Rainha de Espadas na mesa!">

        <div id="modal" class="escondido"><div class="modal-box" id="modalBox"></div></div>
        <div id="modalRanking" class="escondido"><div class="modal-box" id="modalRankingBox"></div></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
